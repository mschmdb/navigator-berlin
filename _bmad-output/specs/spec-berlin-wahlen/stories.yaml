    Choropleth- und Geocode-Bestand.'
- id: '5'
  title: Stimmbezirks-Ebene als Standard-Ansicht
  description: 'Die Winner-Map zeigt amtliche Stimmbezirke als Default-Ebene (Tagesspiegel-Bild,
    Matze-Direktive 19.09.): Ebene stimmbezirk in URL-State/Steuerleiste, Winners-Daten
    via getStimmbezirksWinners (API-Erweiterung), Geometrie pro Wahl-Generation
    über WAHL_TO_GEO mit Jahr-Wechsel-Swap. Kiez/Bezirk bleiben als Vergleichs-Ebenen,
    klar als Aggregat beschriftet.'
  invoke_dev_with: 'Stimmbezirks-Geometrien wechseln zwischen Wahl-Generationen
    (WAHL_TO_GEO); Jahr-Wechsel kann hier also einen Geometrie-Swap bedeuten,
    weiterhin setData auf der bestehenden Instanz, nie Re-Init. Response-Groesse
    beachten (~2.500 Stimmbezirke pro Wahl): pro Jahr fetchen und cachen ist erlaubt,
    abweichend vom Reihe-Bulk der Kiez-Ebene. Zeit-Animation bleibt Kiez-only
    (stabile Geometrie), das ist dokumentierte Absicht.'
- id: '6'
  title: Ergebnis-Panel und Zahlen-Transparenz
  description: 'Tagesspiegel-inspiriertes Panel am Karte-Kapitel: Ergebnis-Liste
