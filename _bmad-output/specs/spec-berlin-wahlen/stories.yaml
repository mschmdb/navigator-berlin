    ausgewählte Gebiet, Datenstand, amtliche Quelle und ein Info-Disclosure zur
    Berechnung (Kiez-Aggregation, Briefwahl). Series-API additiv um ebene=berlin
    erweitern (CAP-8, CAP-12; Matze-Direktive 19.09.).'
  invoke_dev_with: 'Vorbild: Tagesspiegel-BTW25-Ergebnisseite (Zahlen-Anker neben
    der Karte). Deltas client-seitig aus der Series-Response über alle Jahre.
    Wahlbeteiligung kommt erst mit der Wahlbeteiligungs-Story, Platz vorsehen.
    Neutralitäts-Lint gilt.'
