<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />

		<link rel="preload" as="font" type="font/woff2" crossorigin href="%sveltekit.assets%/fonts/plex-sans-latin-var.woff2" />
		<link rel="preload" as="font" type="font/woff2" crossorigin href="%sveltekit.assets%/fonts/plex-serif-latin-400.woff2" />
		<link rel="preload" as="font" type="font/woff2" crossorigin href="%sveltekit.assets%/fonts/plex-mono-latin-400.woff2" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>

		<meta name="text-scale" content="scale" />
		<title>navigator.berlin</title>
		<!--
			Plausible Analytics (Self-Host, EU-FOSS, cookieless). Setzt keine Cookies,
			respektiert Do-Not-Track, kein Cookie-Banner nötig. Variants enabled:
			file-downloads + hash + outbound-links + pageview-props + tagged-events.
		-->
		<script defer data-domain="navigator.berlin" src="https://plausible.navigator.berlin/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script>
		<script>
			window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments); };
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
