<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />

		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/fonts/plex-sans-latin-var.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/fonts/plex-serif-latin-400.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/fonts/plex-mono-latin-400.woff2"
		/>

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<!--
			Plausible Analytics (Self-Host, Open Source, cookieless). Setzt keine Cookies,
			respektiert Do-Not-Track, kein Cookie-Banner nötig. Variants enabled:
			file-downloads + manual + outbound-links + pageview-props + tagged-events.
			Manual-Mode: auto-pushState-Tracking aus, Pageviews werden via afterNavigate
			im Root-Layout explizit getriggert (zuverlässig für SvelteKit-Client-Nav).
		-->
		<script>
			window.plausible =
				window.plausible ||
				function () {
					(window.plausible.q = window.plausible.q || []).push(arguments);
				};
			// Embed-Guard (25.08.): eingebettet (iframe, z.B. Talk-Deck) laden wir
			// das Script gar nicht erst, sonst feuern die Auto-Varianten
			// (outbound-links, file-downloads) trotz Wrapper-Guard.
			(function () {
				var embedded;
				try {
					embedded = window.self !== window.top;
				} catch (e) {
					embedded = true;
				}
				if (embedded) return;
				var s = document.createElement('script');
				s.defer = true;
				s.dataset.domain = 'navigator.berlin';
				s.src =
					'https://p.fliege.dev/js/script.file-downloads.manual.outbound-links.pageview-props.tagged-events.js';
				document.head.appendChild(s);
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
