cluster: klima
locale: de
templates:
  - id: klima-pet-bezirk
    topic: klima
    applicableTo: [bezirk]
    requires: [klima.meanPet]
    question: 'Wie heiß wird es im Bezirk {name} im Sommer?'
    answer: >-
      {klimaSatz} Die gefühlte Temperatur (PET) rechnet Sonne, Wind und Luftfeuchte mit
      ein. Quelle: {klimaSource}, Stand {klimaStand}.

  - id: klima-pet-kiez
    topic: klima
    applicableTo: [kiez]
    requires: [klima.meanPet]
    question: 'Wie heiß wird es im Kiez {name} an Hitzetagen?'
    answer: >-
      {klimaSatz} Die gefühlte Temperatur (PET) rechnet Sonne, Wind und Luftfeuchte mit
      ein. Quelle: {klimaSource}, Stand {klimaStand}.

  - id: klima-was-ist-pet
    applicableTo: [layer]
    requires: []
    question: 'Wofür steht PET?'
    answer: >-
      Für Physiologisch Äquivalente Temperatur, also die gefühlte Temperatur. Sie gibt an,
      welcher Lufttemperatur in einem geschlossenen Raum das Wetter draußen entspricht.
      Wind, Luftfeuchte und Sonnenstrahlung gehen mit ein. So lässt sich Hitzestress
      zwischen Stadtteilen vergleichen.

  - id: klima-was-ist-hitzetag
    applicableTo: [layer]
    requires: []
    question: 'Ab wann zählt ein Tag als Hitzetag?'
    answer: >-
      Ab 30 Grad Höchsttemperatur, so zählt es der Deutsche Wetterdienst. Seit den
      1990er-Jahren ist die Zahl der Hitzetage in Berlin deutlich gestiegen.

  - id: klima-normalperiode
    applicableTo: [layer]
    requires: []
    question: 'Wozu dient eine Klima-Normalperiode?'
    answer: >-
      Sie ist ein Zeitraum von 30 Jahren, mit dem die Weltorganisation für Meteorologie
      Mittelwerte vergleichbar macht. Für Berlin vergleichen wir mit der aktuellen Periode
      1991 bis 2020.

  - id: klima-rolle-versiegelung
    applicableTo: [layer]
    requires: []
    question: 'Wie wirkt sich Versiegelung auf das Stadtklima aus?'
    answer: >-
      Asphalt und Stein speichern tagsüber Wärme und geben sie nachts ab. Stark versiegelte
      Viertel kühlen deshalb schlechter aus als Viertel mit Bäumen, Wiesen oder Wasser. Die
      Stadtklima-Analyse berücksichtigt Versiegelung als einen von mehreren Faktoren.
