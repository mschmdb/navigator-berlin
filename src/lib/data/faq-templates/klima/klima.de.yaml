cluster: klima
locale: de
templates:
  - id: klima-pet-bezirk
    applicableTo: [bezirk]
    requires: [klima.meanPet]
    question: 'Wie heiß wird der Bezirk {name} im Sommer?'
    answer: >-
      Die mittlere Physiologische Äquivalent-Temperatur (PET) im Bezirk {name}
      liegt bei {klimaPet} Grad Celsius (Klassifikation: {klimaKategorie}).
      {klimaErklaerung}
      Quelle: {klimaSource}, Stand {klimaStand}.

  - id: klima-pet-kiez
    applicableTo: [kiez]
    requires: [klima.meanPet]
    question: 'Wie warm wird der Kiez {name} an Hitzetagen?'
    answer: >-
      Die mittlere PET im Kiez {name} liegt bei {klimaPet} Grad Celsius.
      {klimaErklaerung}
      Quelle: {klimaSource}, Stand {klimaStand}.

  - id: klima-was-ist-pet
    applicableTo: [layer]
    requires: []
    question: 'Was ist die Physiologische Äquivalent-Temperatur (PET)?'
    answer: >-
      PET ist ein bioklimatischer Kennwert. Er gibt an, welche Lufttemperatur in
      einem geschlossenen Raum einer gefühlten Temperatur draußen entsprechen
      würde. Wind, Luftfeuchte und Strahlung gehen ein. Der Wert eignet sich,
      um Hitzestress in Stadtgebieten zu vergleichen.

  - id: klima-was-ist-hitzetag
    applicableTo: [layer]
    requires: []
    question: 'Was zählt als Hitzetag?'
    answer: >-
      Der Deutsche Wetterdienst zählt einen Tag mit Tageshöchsttemperatur ab
      30 Grad Celsius als Hitzetag. Die Anzahl der Hitzetage pro Jahr ist in
      Berlin seit den 1990er Jahren deutlich gestiegen, was in der Klima-
      Normalperiode 1991-2020 dokumentiert ist.

  - id: klima-normalperiode
    applicableTo: [layer]
    requires: []
    question: 'Was bedeutet Klima-Normalperiode?'
    answer: >-
      Eine Klima-Normalperiode ist ein 30-Jahres-Referenzzeitraum, mit dem die
      Weltorganisation für Meteorologie Wetter-Mittelwerte vergleichbar macht.
      In Berlin nutzen wir die aktuelle Periode 1991-2020 als Vergleichsbasis.

  - id: klima-rolle-versiegelung
    applicableTo: [layer]
    requires: []
    question: 'Welche Rolle spielt die Versiegelung für das Stadtklima?'
    answer: >-
      Asphalt und Stein speichern Wärme und geben sie nachts wieder ab. Stark
      versiegelte Quartiere kühlen schlechter aus als Quartiere mit Vegetation
      oder offenen Wasserflächen. Die Stadtklima-Analyse berücksichtigt
      Versiegelung als einen Faktor unter mehreren.
