cluster: klima
locale: en
templates:
  - id: klima-pet-bezirk
    topic: klima
    applicableTo: [bezirk]
    requires: [klima.meanPet]
    question: 'How hot does the {name} district get in summer?'
    answer: >-
      {klimaSatz} The perceived temperature (PET) takes sun, wind and humidity into
      account. Source: {klimaSource}, as of {klimaStand}.

  - id: klima-pet-kiez
    topic: klima
    applicableTo: [kiez]
    requires: [klima.meanPet]
    question: 'How hot does the Kiez {name} get on hot days?'
    answer: >-
      {klimaSatz} The perceived temperature (PET) takes sun, wind and humidity into
      account. Source: {klimaSource}, as of {klimaStand}.

  - id: klima-was-ist-pet
    applicableTo: [layer]
    requires: []
    question: 'What does PET stand for?'
    answer: >-
      For Physiological Equivalent Temperature, the perceived temperature. It states which
      air temperature in a closed room the weather outside corresponds to. Wind,
      humidity and solar radiation feed into it. This makes heat stress comparable across
      neighbourhoods.

  - id: klima-was-ist-hitzetag
    applicableTo: [layer]
    requires: []
    question: 'When does a day count as a hot day?'
    answer: >-
      From a maximum temperature of 30 degrees, as the German Weather Service counts it.
      Since the 1990s, the number of hot days in Berlin has risen markedly.

  - id: klima-normalperiode
    applicableTo: [layer]
    requires: []
    question: 'What is a climate normal period for?'
    answer: >-
      It is a 30-year period that the World Meteorological Organization uses to make
      averages comparable. For Berlin, we compare with the current period 1991 to 2020.

  - id: klima-rolle-versiegelung
    applicableTo: [layer]
    requires: []
    question: 'How does surface sealing affect the urban climate?'
    answer: >-
      Asphalt and stone store heat during the day and release it at night. Heavily sealed
      neighbourhoods therefore cool down less than neighbourhoods with trees, meadows or
      water. The urban climate analysis treats sealing as one factor among several.
