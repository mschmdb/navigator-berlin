cluster: gruen
locale: en
templates:
  - id: gruen-versorgung-bezirk
    topic: gruen
    applicableTo: [bezirk]
    requires: [gruen.versorgungDistribution]
    question: 'How well is the {name} district supplied with green space?'
    answer: >-
      {gruenSatz} The Senate measures how much public green space per person lies near
      homes. The navigator.berlin Green & heat score is a different measure{gruenHitzeAktiv}.
      It combines green space and heat{gruenHitzeAktiv}. There the district gets
      {gruenHitzeScore} of 100 points, {gruenHitzeLage}. That is {gruenHitzeVergleich}. Source: {gruenSource}, as of
      {gruenStand}.

  - id: gruen-versorgung-kiez
    topic: gruen
    applicableTo: [kiez]
    requires: [gruen.versorgungDistribution]
    question: 'How well is the Kiez {name} supplied with green space?'
    answer: >-
      {gruenSatz} The Senate measures how much public green space per person lies near
      homes. The navigator.berlin Green & heat score is a different measure{gruenHitzeAktiv}.
      It combines green space and heat{gruenHitzeAktiv}. There the Kiez gets
      {gruenHitzeScore} of 100 points, {gruenHitzeLage}. That is {gruenHitzeVergleich}. Source: {gruenSource}, as of
      {gruenStand}.

  - id: gruen-anzahl-anlagen
    topic: gruen-anlagen
    applicableTo: [bezirk]
    requires: [gruen.gruenanlagenCount]
    question: 'How many public green spaces are there in the {name} district?'
    answer: >-
      The Senate counts {gruenanlagenCount} public green spaces in the district. Private
      gardens and allotments are not included. Source: {gruenanlagenSource}, as of
      {gruenanlagenStand}.

  - id: gruen-was-bedeutet-versorgung
    applicableTo: [layer]
    requires: []
    question: 'How does the Senate measure green space provision?'
    answer: >-
      For each planning area, the Senate works out how much public green space per
      person lies near homes. The benchmark is 6 square metres per person. Depending on
      how far an area reaches this value, it counts as well, moderately or poorly served.
      Planning areas are the smallest units of Berlin's urban planning; every Kiez
      consists of several. In the answers about Kieze and districts they are called
      subareas.

  - id: gruen-rolle-hitze
    applicableTo: [layer]
    requires: []
    question: 'How do green spaces cool the city?'
    answer: >-
      Trees and larger green spaces cool through shade and evaporation. Densely built
      neighbourhoods with little greenery stay measurably warmer on summer days than
      similar neighbourhoods with more green. Urban climate analyses show this.
