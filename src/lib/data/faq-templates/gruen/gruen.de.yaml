cluster: gruen
locale: de
templates:
  - id: gruen-versorgung-bezirk
    topic: gruen
    applicableTo: [bezirk]
    requires: [gruen.versorgungDistribution]
    question: 'Wie gut ist der Bezirk {name} mit Grün versorgt?'
    answer: >-
      {gruenSatz} Der Senat misst dabei, wie viel öffentliches Grün pro Kopf in
      Wohnungsnähe liegt. Davon zu trennen ist der Grün-und-Hitze-Score von
      navigator.berlin{gruenHitzeAktiv}. Er rechnet Grün und Hitze zusammen{gruenHitzeAktiv}.
      Dort kommt der Bezirk auf {gruenHitzeScore} von 100 Punkten, {gruenHitzeLage}. Das ist
      {gruenHitzeVergleich}.
      Quelle: {gruenSource}, Stand {gruenStand}.

  - id: gruen-versorgung-kiez
    topic: gruen
    applicableTo: [kiez]
    requires: [gruen.versorgungDistribution]
    question: 'Wie gut ist der Kiez {name} mit Grün versorgt?'
    answer: >-
      {gruenSatz} Der Senat misst dabei, wie viel öffentliches Grün pro Kopf in
      Wohnungsnähe liegt. Davon zu trennen ist der Grün-und-Hitze-Score von
      navigator.berlin{gruenHitzeAktiv}. Er rechnet Grün und Hitze zusammen{gruenHitzeAktiv}.
      Dort kommt der Kiez auf {gruenHitzeScore} von 100 Punkten, {gruenHitzeLage}. Das ist
      {gruenHitzeVergleich}.
      Quelle: {gruenSource}, Stand {gruenStand}.

  - id: gruen-anzahl-anlagen
    topic: gruen-anlagen
    applicableTo: [bezirk]
    requires: [gruen.gruenanlagenCount]
    question: 'Wie viele öffentliche Grünanlagen gibt es im Bezirk {name}?'
    answer: >-
      Der Senat zählt im Bezirk {gruenanlagenCount} öffentliche Grünanlagen. Private
      Gärten und Kleingärten sind nicht dabei. Quelle: {gruenanlagenSource}, Stand
      {gruenanlagenStand}.

  - id: gruen-was-bedeutet-versorgung
    applicableTo: [layer]
    requires: []
    question: 'Wie misst der Senat die Grünversorgung?'
    answer: >-
      Der Senat rechnet für jeden Planungsraum aus, wie viel öffentliches Grün pro Kopf
      in Wohnungsnähe liegt. Als Richtwert gelten 6 Quadratmeter pro Person. Je nachdem,
      wie weit ein Gebiet diesen Wert erreicht, gilt es als gut, mittel oder schlecht
      versorgt. Planungsräume sind die kleinsten Gebiete der Berliner Stadtplanung; jeder
      Kiez besteht aus mehreren. In den Antworten zu Kiezen und Bezirken heißen sie
      Teilgebiete.

  - id: gruen-rolle-hitze
    applicableTo: [layer]
    requires: []
    question: 'Wie kühlen Grünflächen die Stadt?'
    answer: >-
      Bäume und größere Grünflächen kühlen durch Schatten und Verdunstung. Dicht bebaute
      Viertel mit wenig Grün bleiben an Sommertagen messbar wärmer als ähnlich bebaute
      Viertel mit mehr Grün. Das zeigen die Stadtklima-Analysen.
