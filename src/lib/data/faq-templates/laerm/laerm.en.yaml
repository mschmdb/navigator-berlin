cluster: laerm
locale: en
templates:
  - id: laerm-dominant-bezirk
    topic: laerm
    applicableTo: [bezirk]
    requires: [laerm.categoryDistribution]
    question: 'How loud is it in the Bezirk {name}?'
    answer: >-
      {laermSatz} This means traffic noise from roads, rail and aircraft, averaged over
      day, evening and night. The navigator.berlin Quiet & air score combines noise and
      air{ruheLuftAktiv}. There the Bezirk gets {ruheLuftScore} of 100 points, {ruheLuftLage}. That
      is {ruheLuftVergleich}. Source: {laermSource}, as of {laermStand}.

  - id: laerm-dominant-kiez
    topic: laerm
    applicableTo: [kiez]
    requires: [laerm.categoryDistribution]
    question: 'How loud is it in the Kiez {name}?'
    answer: >-
      {laermSatz} This means traffic noise from roads, rail and aircraft, averaged over
      day, evening and night. The navigator.berlin Quiet & air score combines noise and
      air{ruheLuftAktiv}. There the Kiez gets {ruheLuftScore} of 100 points, {ruheLuftLage}. That
      is {ruheLuftVergleich}. Source: {laermSource}, as of {laermStand}.

  - id: laerm-warum-nacht-schaedlicher
    applicableTo: [layer]
    requires: []
    question: 'Why does night-time noise count for more?'
    answer: >-
      At night, noise disturbs sleep, and during sleep the heart, circulation and nerves
      recover. The World Health Organization recommends a guideline value of 40 dB for
      night-time noise (LNIGHT). The Berlin noise mapping therefore reports LDEN and
      LNIGHT separately.

  - id: laerm-was-bedeutet-lden
    applicableTo: [layer]
    requires: []
    question: 'What does LDEN stand for?'
    answer: >-
      For “Level Day-Evening-Night”, an average of noise over 24 hours. Evening and night
      count with a penalty of 5 and 10 dB, because noise disturbs more then. The EU uses
      the value so that noise maps can be compared.

  - id: laerm-wie-aktuell
    topic: laerm-aktualitaet
    applicableTo: [bezirk, kiez]
    requires: [laerm.dominantCategory]
    question: 'How up to date is the noise data for {name}?'
    answer: >-
      The noise classes date from {laermStand}. The Senate has the noise map recalculated
      every five years, in line with the EU cycle.

  - id: laerm-welche-quellen
    applicableTo: [layer]
    requires: []
    question: 'Which noise goes into the map?'
    answer: >-
      The noise mapping records road, rail, aircraft and industrial noise separately.
      This map shows traffic noise from roads, rail and air traffic combined (LDEN), per
      planning area.

  - id: laerm-was-tun-bei-belastung
    applicableTo: [layer]
    requires: []
    question: 'Who do I contact if noise at my address bothers me?'
    answer: >-
      The Senate Department for Mobility takes suggestions for the noise action plan.
      Complaints about a specific source, such as a construction site or a business, go
      to the Bezirk office (Bezirksamt) or the public order office (Ordnungsamt).

  - id: laerm-warum-keine-db-werte
    applicableTo: [layer]
    requires: []
    question: 'Why does the map not show dB values?'
    answer: >-
      The open Berlin data provides only a noise class per planning area, such as
      “medium” or “high”, not measured values. We show the class the way the Senate
      publishes it. An exact figure would suggest a precision the data does not have.
