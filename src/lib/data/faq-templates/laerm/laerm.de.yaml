cluster: laerm
locale: de
templates:
  - id: laerm-dominant-bezirk
    topic: laerm
    applicableTo: [bezirk]
    requires: [laerm.categoryDistribution]
    question: 'Wie laut ist es im Bezirk {name}?'
    answer: >-
      {laermSatz} Gemeint ist der Verkehrslärm von Straße, Schiene und Flugzeugen,
      gemittelt über Tag, Abend und Nacht. Der Ruhe-und-Luft-Score von navigator.berlin
      rechnet Lärm und Luft zusammen{ruheLuftAktiv}. Dort kommt der Bezirk auf {ruheLuftScore}
      von 100 Punkten, {ruheLuftLage}. Das ist {ruheLuftVergleich}. Quelle: {laermSource}, Stand
      {laermStand}.
    editorialNote: >-
      Die Lärmkarte liefert je Planungsraum eine Klasse, keine dB-Werte. Deshalb nennt
      die Antwort Klassen und ihre Anteile.

  - id: laerm-dominant-kiez
    topic: laerm
    applicableTo: [kiez]
    requires: [laerm.categoryDistribution]
    question: 'Wie laut ist es im Kiez {name}?'
    answer: >-
      {laermSatz} Gemeint ist der Verkehrslärm von Straße, Schiene und Flugzeugen,
      gemittelt über Tag, Abend und Nacht. Der Ruhe-und-Luft-Score von navigator.berlin
      rechnet Lärm und Luft zusammen{ruheLuftAktiv}. Dort kommt der Kiez auf {ruheLuftScore}
      von 100 Punkten, {ruheLuftLage}. Das ist {ruheLuftVergleich}. Quelle: {laermSource}, Stand
      {laermStand}.

  - id: laerm-warum-nacht-schaedlicher
    applicableTo: [layer]
    requires: []
    question: 'Warum zählt Lärm in der Nacht stärker?'
    answer: >-
      Nachts stört Lärm den Schlaf, und im Schlaf erholen sich Herz, Kreislauf und
      Nerven. Die Weltgesundheitsorganisation empfiehlt für Nachtlärm (LNIGHT) einen
      Richtwert von 40 dB. Die Berliner Lärmkartierung weist deshalb LDEN und LNIGHT
      getrennt aus.

  - id: laerm-was-bedeutet-lden
    applicableTo: [layer]
    requires: []
    question: 'Wofür steht LDEN?'
    answer: >-
      Für „Level Day-Evening-Night“, einen Mittelwert des Lärms über 24 Stunden. Abend und
      Nacht zählen mit 5 und 10 dB Aufschlag, weil Lärm dann mehr stört. Die EU nutzt den
      Wert, damit sich Lärmkarten vergleichen lassen.

  - id: laerm-wie-aktuell
    topic: laerm-aktualitaet
    applicableTo: [bezirk, kiez]
    requires: [laerm.dominantCategory]
    question: 'Wie aktuell sind die Lärm-Daten für {name}?'
    answer: >-
      Die Lärmklassen haben den Stand {laermStand}. Der Senat lässt die Lärmkarte im
      Rhythmus der EU alle fünf Jahre neu berechnen.

  - id: laerm-welche-quellen
    applicableTo: [layer]
    requires: []
    question: 'Welcher Lärm fließt in die Karte ein?'
    answer: >-
      Die Lärmkartierung erfasst Straßen-, Schienen-, Flug- und Industrielärm getrennt.
      Diese Karte zeigt den Verkehrslärm aus Straße, Schiene und Flugverkehr zusammen
      (LDEN), je Planungsraum.

  - id: laerm-was-tun-bei-belastung
    applicableTo: [layer]
    requires: []
    question: 'An wen wende ich mich, wenn mich Lärm an meiner Adresse belastet?'
    answer: >-
      Für den Lärmaktionsplan nimmt die Senatsverwaltung für Mobilität Hinweise entgegen.
      Beschwerden über eine konkrete Quelle, etwa eine Baustelle oder einen Betrieb, gehen
      an das Bezirksamt oder das Ordnungsamt.

  - id: laerm-warum-keine-db-werte
    applicableTo: [layer]
    requires: []
    question: 'Warum zeigt die Karte keine dB-Werte?'
    answer: >-
      Die offenen Berliner Daten liefern je Planungsraum nur eine Lärmklasse, etwa
      „mittel“ oder „hoch“, keine Messwerte. Wir zeigen die Klasse so, wie der Senat sie
      veröffentlicht. Eine genaue Zahl würde eine Genauigkeit vortäuschen, die in den
      Daten nicht steckt.
