cluster: oepnv
locale: en
templates:
  - id: oepnv-dichte-bezirk
    topic: oepnv
    applicableTo: [bezirk]
    requires: [oepnv.stopsPerKm2]
    question: 'How well is the Bezirk {name} served by bus and train?'
    answer: >-
      {oepnvUrteil} There are {oepnvStopsPerKm2} stops per square kilometre.
      {oepnvModi} In the navigator.berlin Mobility score, the Bezirk gets
      {mobilitaetScore} of 100 points, {mobilitaetLage}. That is {mobilitaetVergleich}.
      Source: {oepnvSource}, as of {oepnvStand}.

  - id: oepnv-dichte-kiez
    topic: oepnv
    applicableTo: [kiez]
    requires: [oepnv.stopsPerKm2]
    question: 'How well is the Kiez {name} served by bus and train?'
    answer: >-
      {oepnvUrteil} There are {oepnvStopsPerKm2} stops per square kilometre.
      {oepnvModi} In the navigator.berlin Mobility score, the Kiez gets
      {mobilitaetScore} of 100 points, {mobilitaetLage}. That is {mobilitaetVergleich}.
      Source: {oepnvSource}, as of {oepnvStand}.

  - id: oepnv-was-bedeutet-dichte
    applicableTo: [layer]
    requires: []
    question: 'How much does stop density tell you?'
    answer: >-
      It is a rough measure of how many stops lie nearby. It says nothing about
      frequency, routes or step-free access. In Berlin, density is usually high in the
      city centre and at interchanges, and low on the outskirts.

  - id: oepnv-walk-score-logik
    applicableTo: [layer]
    requires: []
    question: 'Are walking distances or step-free access taken into account?'
    answer: >-
      No. The value counts the stops inside the area boundary and divides them by the
      area. How far the walk is and whether a station is step-free does not feed in.

  - id: oepnv-welche-modi
    applicableTo: [layer]
    requires: []
    question: 'Which modes of transport count?'
    answer: >-
      U-Bahn stations, S-Bahn stations, tram stops and bus stops, all together. Regional
      rail stations do not count separately.

  - id: oepnv-warum-nicht-fahrplandaten
    applicableTo: [layer]
    requires: []
    question: 'Why does navigator.berlin not show live timetables?'
    answer: >-
      We work with fixed data releases from open sources that we can check and version.
      Live timetables would need a constantly running feed, and their values would be out
      of date within minutes.
