cluster: oepnv
locale: de
templates:
  - id: oepnv-dichte-bezirk
    topic: oepnv
    applicableTo: [bezirk]
    requires: [oepnv.stopsPerKm2]
    question: 'Wie gut ist der Bezirk {name} mit Bus und Bahn angebunden?'
    answer: >-
      {oepnvUrteil} Auf einen Quadratkilometer kommen {oepnvStopsPerKm2} Haltestellen.
      {oepnvModi} Im Mobilitäts-Score von navigator.berlin kommt der Bezirk auf
      {mobilitaetScore} von 100 Punkten, {mobilitaetLage}. Das ist {mobilitaetVergleich}.
      Quelle: {oepnvSource}, Stand {oepnvStand}.

  - id: oepnv-dichte-kiez
    topic: oepnv
    applicableTo: [kiez]
    requires: [oepnv.stopsPerKm2]
    question: 'Wie gut ist der Kiez {name} mit Bus und Bahn angebunden?'
    answer: >-
      {oepnvUrteil} Auf einen Quadratkilometer kommen {oepnvStopsPerKm2} Haltestellen.
      {oepnvModi} Im Mobilitäts-Score von navigator.berlin kommt der Kiez auf
      {mobilitaetScore} von 100 Punkten, {mobilitaetLage}. Das ist {mobilitaetVergleich}.
      Quelle: {oepnvSource}, Stand {oepnvStand}.

  - id: oepnv-was-bedeutet-dichte
    applicableTo: [layer]
    requires: []
    question: 'Wie aussagekräftig ist die Haltestellendichte?'
    answer: >-
      Sie ist ein grobes Maß dafür, wie viele Haltestellen in der Nähe liegen. Über Takt,
      Linien und Barrierefreiheit sagt sie nichts. In Berlin ist die Dichte in der
      Innenstadt und an Umsteigeknoten meist hoch, am Stadtrand niedrig.

  - id: oepnv-walk-score-logik
    applicableTo: [layer]
    requires: []
    question: 'Zählen Fußwege oder Barrierefreiheit mit?'
    answer: >-
      Nein. Der Wert zählt die Haltestellen innerhalb der Gebietsgrenzen und teilt sie
      durch die Fläche. Wie weit der Fußweg ist und ob eine Station barrierefrei ist,
      fließt nicht ein.

  - id: oepnv-welche-modi
    applicableTo: [layer]
    requires: []
    question: 'Welche Verkehrsmittel zählen mit?'
    answer: >-
      U-Bahnhöfe, S-Bahnhöfe, Tram- und Bushaltestellen, alle zusammen. Regionalbahnhöfe
      zählen nicht extra.

  - id: oepnv-warum-nicht-fahrplandaten
    applicableTo: [layer]
    requires: []
    question: 'Warum zeigt navigator.berlin keine Live-Fahrpläne?'
    answer: >-
      Wir arbeiten mit festen Datenständen aus offenen Quellen, die wir prüfen und
      versionieren können. Live-Fahrpläne bräuchten einen dauernd laufenden Abruf, und ihre
      Werte wären nach wenigen Minuten überholt.
