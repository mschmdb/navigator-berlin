cluster: wohnen
locale: en
templates:
  - id: wohnen-wohnlage-bezirk
    topic: wohnlage
    applicableTo: [bezirk]
    requires: [wohnen.dominantWohnlage]
    question: 'Which residential area type is most common in the {name} district?'
    answer: >-
      The {wohnenWohnlage} of the Berlin Mietspiegel is the most common. The Mietspiegel
      sorts street sections into simple, medium and good residential areas by buildings
      and surroundings. The rating says nothing about the people who live there. Source:
      {wohnenSource}, as of {wohnenStand}.

  - id: wohnen-wohnlage-kiez
    topic: wohnlage
    applicableTo: [kiez]
    requires: [wohnen.dominantWohnlage]
    question: 'Which residential area type is most common in the Kiez {name}?'
    answer: >-
      The {wohnenWohnlage} of the Berlin Mietspiegel is the most common. The rating applies
      to street sections and rows of houses, not to single addresses. Source:
      {wohnenSource}, as of {wohnenStand}.

  - id: wohnen-mss-bezirk
    topic: sozialstruktur
    applicableTo: [bezirk]
    requires: [wohnen.dominantMss]
    question: 'Where does the {name} district stand in the Senate social monitoring?'
    answer: >-
      {wohnenMssBeschreibung} The Monitoring Social Urban Development sorts every planning
      area into one of four levels by income, employment and education. The level applies
      to whole areas, not to individual households. Source: {wohnenMssSource}, as of
      {wohnenMssStand}.

  - id: wohnen-warum-keine-mietpreise
    applicableTo: [layer]
    requires: []
    question: 'Why does navigator.berlin not give a rent for my address?'
    answer: >-
      Rents depend on year of construction, fittings, location and reference date. The
      Berlin Mietspiegel gives ranges per residential area type and building age, not
      values for single addresses. The official value for a flat comes from
      mietspiegel.berlin.de.

  - id: wohnen-was-ist-brw
    applicableTo: [layer]
    requires: []
    question: 'How do the standard land value and the Mietspiegel differ?'
    answer: >-
      The standard land value (Bodenrichtwert) is an average land price per square metre,
      set by the Committee of Valuation Experts (Gutachterausschuss). The Mietspiegel gives
      the usual local comparative rents for flats. Both apply to areas, not to single
      addresses.

  - id: wohnen-stigma-disclaimer
    topic: wohnen-hinweis
    applicableTo: [bezirk, kiez]
    requires: []
    question: 'Does navigator.berlin rate residential areas as good or bad?'
    answer: >-
      No. We show ratings from official data, such as the Mietspiegel residential area
      type, the social monitoring or the standard land value. These ratings describe a
      place; they do not judge it. We do not use labels such as “popular Kiez” or “good
      district”.

  - id: wohnen-wohnschutz-einordnung
    topic: wohnschutz
    applicableTo: [bezirk, kiez]
    requires: []
    requiresScore: [wohnschutz]
    question: 'How much tenant protection is there in {name}?'
    answer: >-
      In the navigator.berlin Tenant protection score, {ortDer} gets {wohnschutzScore} of
      100 points, {wohnschutzLage}. That is {wohnschutzVergleich}. The score measures how
      much of the area is under Milieuschutz. Milieuschutz is meant to protect tenants from
      displacement.
