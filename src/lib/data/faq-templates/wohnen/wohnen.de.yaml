cluster: wohnen
locale: de
templates:
  - id: wohnen-wohnlage-bezirk
    topic: wohnlage
    applicableTo: [bezirk]
    requires: [wohnen.dominantWohnlage]
    question: 'Welche Wohnlage überwiegt im Bezirk {name}?'
    answer: >-
      Am häufigsten die {wohnenWohnlage} des Berliner Mietspiegels. Der Mietspiegel teilt
      Straßenabschnitte nach Bebauung und Umfeld in einfache, mittlere und gute Wohnlagen
      ein. Über die Menschen, die dort wohnen, sagt die Einstufung nichts. Quelle:
      {wohnenSource}, Stand {wohnenStand}.

  - id: wohnen-wohnlage-kiez
    topic: wohnlage
    applicableTo: [kiez]
    requires: [wohnen.dominantWohnlage]
    question: 'Welche Wohnlage überwiegt im Kiez {name}?'
    answer: >-
      Am häufigsten die {wohnenWohnlage} des Berliner Mietspiegels. Die Einstufung gilt
      für Straßenabschnitte und Häuserzeilen, nicht für einzelne Adressen. Quelle:
      {wohnenSource}, Stand {wohnenStand}.

  - id: wohnen-mss-bezirk
    topic: sozialstruktur
    applicableTo: [bezirk]
    requires: [wohnen.dominantMss]
    question: 'Wie steht der Bezirk {name} im Sozialmonitoring des Senats da?'
    answer: >-
      {wohnenMssBeschreibung} Das Monitoring Soziale Stadtentwicklung ordnet jeden
      Planungsraum nach Einkommen, Beschäftigung und Bildung in eine von vier Stufen ein.
      Die Stufe gilt für ganze Gebiete, nicht für einzelne Haushalte. Quelle:
      {wohnenMssSource}, Stand {wohnenMssStand}.

  - id: wohnen-warum-keine-mietpreise
    applicableTo: [layer]
    requires: []
    question: 'Warum nennt navigator.berlin keine Miete für meine Adresse?'
    answer: >-
      Mieten hängen von Baujahr, Ausstattung, Lage und Stichtag ab. Der Berliner
      Mietspiegel nennt Spannen je Wohnlage und Baualter, keine Werte für einzelne
      Adressen. Den offiziellen Wert für eine Wohnung liefert mietspiegel.berlin.de.

  - id: wohnen-was-ist-brw
    applicableTo: [layer]
    requires: []
    question: 'Worin unterscheiden sich Bodenrichtwert und Mietspiegel?'
    answer: >-
      Der Bodenrichtwert ist ein mittlerer Grundstückspreis pro Quadratmeter, ermittelt
      vom Gutachterausschuss. Der Mietspiegel nennt die ortsüblichen Vergleichsmieten für
      Wohnungen. Beide gelten für Gebiete, nicht für einzelne Adressen.

  - id: wohnen-stigma-disclaimer
    topic: wohnen-hinweis
    applicableTo: [bezirk, kiez]
    requires: []
    question: 'Bewertet navigator.berlin Wohngebiete als gut oder schlecht?'
    answer: >-
      Nein. Wir zeigen Einstufungen aus amtlichen Daten, etwa die Wohnlage im Mietspiegel,
      das Sozialmonitoring oder den Bodenrichtwert. Diese Einstufungen beschreiben einen
      Ort, sie werten ihn nicht. Begriffe wie „beliebter Kiez“ oder „guter Bezirk“
      verwenden wir nicht.

  - id: wohnen-wohnschutz-einordnung
    topic: wohnschutz
    applicableTo: [bezirk, kiez]
    requires: []
    requiresScore: [wohnschutz]
    question: 'Wie viel Wohnschutz gibt es in {name}?'
    answer: >-
      Im Wohnschutz-Score von navigator.berlin kommt {ortDer} auf {wohnschutzScore} von
      100 Punkten, {wohnschutzLage}. Das ist {wohnschutzVergleich}. Der Score misst, wie
      viel des Gebiets unter Milieuschutz steht. Milieuschutz soll Mieterinnen und Mieter
      vor Verdrängung schützen.
